# Тексты и тайминги воронки. Тексты в HTML-разметке Telegram.
# Изменения применяются после перезапуска бота.

messages:
  # {name} подставится из профиля пользователя
  greeting: |
    Привет, {name}! 👋
    Это бот регистрации на бесплатный эфир «Нейросети для работы».
  phone_request: |
    Чтобы закрепить место и получить напоминание, поделитесь номером телефона — кнопка ниже.
  phone_button: "📱 Поделиться номером"
  phone_received: |
    Готово, вы зарегистрированы ✅
    Скоро пришлём материалы к эфиру.
  already_registered: |
    Вы уже зарегистрированы ✅ Ждите материалы.
  not_own_contact: |
    Нужен именно ваш номер — нажмите кнопку «📱 Поделиться номером».
  remind_phone: |
    Остался один шаг — поделитесь номером кнопкой ниже.

# Сообщения после регистрации (отсчёт от момента, когда пользователь поделился номером).
# id должен быть уникальным: по нему считается статистика в дашборде.
schedule:
  - id: warmup
    title: "Материалы к эфиру"
    delay_seconds: 10
    text: |
      🎁 Обещанный подарок: чек-лист «10 задач, которые нейросеть сделает за вас».
      Сохраните, пригодится на эфире.
  - id: reminder
    title: "Напоминание об эфире"
    delay_seconds: 60
    text: |
      ⏰ Эфир уже скоро! Ссылку пришлём сюда за 15 минут до начала.
      Вопросы спикеру можно написать в ответ на это сообщение.
