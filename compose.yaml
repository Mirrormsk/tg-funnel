# Запуск: docker compose up --build
# Секреты (BOT_TOKEN и др.) берутся из .env — он не попадает ни в git, ни в образ.
services:
  bot:
    build: .
    image: tg-funnel:local
    env_file: .env
    environment:
      HOST: 0.0.0.0  # внутри контейнера слушаем все интерфейсы
    ports:
      # Дашборд доступен только с этой машины (туннель ходит на localhost); порт можно сменить: DASHBOARD_PORT=8081
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - funnel-data:/app/data
      - ./config.yaml:/app/config.yaml:ro  # тексты и тайминги можно менять без пересборки образа
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  funnel-data:
