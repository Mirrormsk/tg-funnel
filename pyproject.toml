[project]
name = "tg-funnel"
version = "0.1.0"
description = "Мини-воронка регистраций в Telegram с дашбордом в Mini App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # порядок импортов
    "B",             # bugbear
    "UP",            # современный синтаксис
    "S",             # bandit: безопасность
    "ASYNC",         # ошибки в async-коде
    "SIM", "RET", "PTH", "C4", "RUF",
]
# Кириллица в текстах — намеренно, это не опечатки в латинице
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert и фейковые токены в тестах — норма

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
